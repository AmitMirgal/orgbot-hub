name: Start Here link re-check

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  report:
    name: Re-check Start Here x.ai links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Re-fetch Start Here x.ai URLs
        run: node --experimental-strip-types --import ./scripts/ts-alias.mjs scripts/check-start-here-links.ts
